<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funding CRM | Enlightened AI</title>
    <link rel="stylesheet" href="assets/funding.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <aside>
        <div style="margin-bottom: 2rem;">
            <h2 style="font-size:1.2rem;">FUNDING CRM</h2>
            <div class="small muted">Enlightened AI Research Lab</div>
        </div>

        <div style="margin-bottom: 2rem;">
            <h3 class="small muted" style="margin-bottom:0.5rem; text-transform:uppercase;">Pipeline Stats</h3>
            <div id="stats-container" style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                </div>
        </div>

        <div class="exclusions-box">
            <h3 class="small muted" style="margin-bottom:0.5rem; text-transform:uppercase;">Excluded / Covered</h3>
            <div id="exclusions-list">
                </div>
        </div>
    </aside>

    <main>
        <div class="toolbar">
            <input type="text" id="search" class="search-box" placeholder="Search organization, program, or notes...">
            
            <div style="display:flex; gap:8px;">
                <button class="btn" onclick="exportJSON()">↓ Export</button>
                <button class="btn" onclick="document.getElementById('importFile').click()">↑ Import</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importJSON(this)">
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width:30%">Organization / Program</th>
                        <th style="width:8%">Pri</th>
                        <th style="width:15%">Range / Type</th>
                        <th style="width:15%">Stage / Deadline</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>

        <div id="toast">Saved</div>
    </main>

    <script src="assets/funding.js"></script>
</body>
</html>
