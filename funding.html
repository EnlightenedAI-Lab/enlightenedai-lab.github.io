<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAIRL | FUNDING CMD v14.x</title>
<style>
    :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #0f172a;
        --text-sub: #64748b;
        --border: #e2e8f0;
        --primary: #2563eb;
        --accent: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        font-size: 14px;
    }
    /* LAYOUT */
    .app-container {
        max-width: 1400px;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        height: 95vh;
    }
    header {
        padding: 15px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f1f5f9;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .badge { background: var(--primary); color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; }

    /* CONTROLS */
    .controls {
        padding: 15px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        align-items: flex-end;
    }
    .control-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 11px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; }
    input, select {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 13px;
        min-width: 150px;
    }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }
    
    /* NEW QUICK SEARCH STYLE */
    #quick-search {
        min-width: 300px;
        border-left: 3px solid var(--accent);
        background: #f0fdf4;
    }

    /* DATA GRID */
    .grid-container {
        flex: 1;
        overflow: auto;
        position: relative;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1200px;
    }
    thead {
        position: sticky;
        top: 0;
        background: #f8fafc;
        z-index: 10;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    th {
        text-align: left;
        padding: 10px 15px;
        font-size: 11px;
        text-transform: uppercase;
        color: var(--text-sub);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
    }
    td {
        padding: 12px 15px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
    }
    tr:hover { background: #f8fafc; }
    
    /* CELLS */
    .cell-id { font-family: var(--font-mono); color: var(--text-sub); font-size: 11px; }
    .cell-name { font-weight: 600; color: var(--primary); cursor: pointer; }
    .cell-sec { font-weight: 700; width: 40px; text-align: center; }
    .sec-A { color: var(--accent); background: #ecfdf5; border-radius: 4px; }
    .sec-B { color: var(--primary); background: #eff6ff; border-radius: 4px; }
    .sec-E { color: var(--text-sub); background: #f1f5f9; border-radius: 4px; }
    
    .status-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
    }
    .st-todo { background: #e2e8f0; color: var(--text-sub); }
    .st-prog { background: #fef3c7; color: #b45309; }
    .st-done { background: #dcfce7; color: #15803d; }
    .st-stop { background: #fee2e2; color: #b91c1c; }

    .logistics-tag {
        font-size: 10px;
        padding: 2px 4px;
        border: 1px solid var(--border);
        border-radius: 3px;
        margin-right: 4px;
        background: white;
        color: var(--text-sub);
    }

    .btn-apply {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-decoration: none;
        color: white;
        background: var(--primary);
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        transition: opacity 0.2s;
    }
    .btn-apply:hover { opacity: 0.9; }

    /* FOOTER */
    footer {
        padding: 10px 20px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--text-sub);
        display: flex;
        justify-content: space-between;
        background: #f8fafc;
    }
</style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>EAIRL | FUNDING CMD <span class="badge">v14.x</span></h1>
        <div style="font-size: 11px; color: var(--text-sub);">Local-First • Persistent</div>
    </header>

    <div class="controls">
        <div class="control-group" style="flex: 2;">
            <label for="quick-search">> QUICK FIND (Exact / Contains / Link)</label>
            <input type="text" id="quick-search" placeholder="Type name, logic, or paste link..." onkeyup="app.handleSearch()">
        </div>

        <div class="control-group">
            <label>Global Filter</label>
            <input type="text" id="search-input" placeholder="Search all fields..." onkeyup="app.handleSearch()">
        </div>
        <div class="control-group">
            <label>Status</label>
            <select id="filter-status" onchange="app.handleSearch()">
                <option value="ALL">All Statuses</option>
                <option value="TODO">To Do</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="SUBMITTED">Submitted</option>
                <option value="WON">Won</option>
                <option value="LOST">Lost</option>
                <option value="BLOCKED">Blocked</option>
            </select>
        </div>
        <div class="control-group">
            <label>Type</label>
            <select id="filter-type" onchange="app.handleSearch()">
                <option value="ALL">All Types</option>
                <option value="GRANT">Grant</option>
                <option value="BOUNTY">Bounty</option>
                <option value="CONTRACT">Contract</option>
                <option value="INFRA">Infrastructure</option>
            </select>
        </div>
    </div>

    <div class="grid-container">
        <table id="data-table">
            <thead>
                <tr>
                    <th width="40">SEC</th>
                    <th width="40">ID</th>
                    <th>TARGET NAME</th>
                    <th>TYPE</th>
                    <th>STATUS</th>
                    <th>LOGISTICS (Reality/Lat/Eff)</th>
                    <th>DEADLINE</th>
                    <th>ACTION</th>
                </tr>
            </thead>
            <tbody id="table-body">
                </tbody>
        </table>
    </div>

    <footer>
        <span id="record-count">Loading...</span>
        <button onclick="app.resetData()" style="background:none; border:none; color:#cbd5e1; cursor:pointer;">Reset DB</button>
    </footer>
</div>

<script>
/**
 * EAIRL FUNDING CMD v14.x
 * Core Logic & Data
 */

const DB_KEY = 'eairl_funding_v14_db';

// V14 SEED DATA (Instruction A & B implemented)
// Sec A: 7 Survivors. Sec B: Martian Fix.
const seedData = [
    // SECTION A: SURVIVORS (7 Items)
    { id: 1, sec: 'A', name: 'NLnet Foundation (NGI Zero)', type: 'GRANT', status: 'TODO', deadline: 'Rolling', 
      link_apply: 'https://nlnet.nl/commonsfund', 
      reality: 'CASH', latency: '1-3mo', effort: 'Med', notes: 'Focus: Open Infrastructure / Standards.' },
      
    { id: 2, sec: 'A', name: 'Emergent Ventures (Mercatus)', type: 'GRANT', status: 'TODO', deadline: 'Rolling', 
      link_apply: 'https://www.mercatus.org/emergent-ventures', 
      reality: 'CASH', latency: '<30d', effort: 'Low', notes: 'Focus: High-agency / Outliers.' },
      
    { id: 101, sec: 'A', name: 'NRC IRAP', type: 'GRANT', status: 'TODO', deadline: 'Rolling', 
      link_apply: 'https://nrc.canada.ca/en/support-technology-innovation', 
      reality: 'CASH', latency: '3-6mo', effort: 'High', notes: 'Gov funding. Requires "tech innovation".' },
      
    { id: 3, sec: 'A', name: 'Aligned Studies Foundation (ASF)', type: 'GRANT', status: 'TODO', deadline: 'Rolling', 
      link_apply: 'https://alignedstudies.com/apply', 
      reality: 'CASH', latency: '1-3mo', effort: 'Med', notes: 'Independent researcher focus.' },
      
    { id: 4, sec: 'A', name: 'AI Safety Camp (AISC)', type: 'GRANT', status: 'TODO', deadline: 'Rolling', 
      link_apply: 'https://www.aisafety.camp/about-faq', 
      reality: 'CASH', latency: '<30d', effort: 'Low', notes: 'Microgrants for immediate costs.' },
      
    { id: 5, sec: 'A', name: 'AE Studio (Alignment)', type: 'GRANT', status: 'TODO', deadline: 'Rolling', 
      link_apply: 'https://research.ae.studio/grants', 
      reality: 'CASH', latency: '1-3mo', effort: 'Med', notes: 'Neglected approaches / Tooling.' },
      
    { id: 6, sec: 'A', name: 'BlueDot Impact (AGI Strategy)', type: 'GRANT', status: 'TODO', deadline: 'Rolling', 
      link_apply: 'https://apply.bluedot.org/', 
      reality: 'CASH', latency: '1-3mo', effort: 'Med', notes: 'Governance & Strategy tooling.' },

    // SECTION B: COMPETITIONS / BOUNTIES
    { id: 201, sec: 'B', name: 'Martian Interpretability Prize', type: 'GRANT', status: 'TODO', deadline: 'Rolling', 
      link_apply: 'https://withmartian.com/prize', 
      reality: 'CASH', latency: 'Rolling', effort: 'High', notes: 'Research proposals for mechanistic interp.' },
      
    { id: 202, sec: 'B', name: 'Google AI VRP', type: 'BOUNTY', status: 'TODO', deadline: 'N/A', 
      link_apply: 'https://bughunters.google.com/report', 
      reality: 'CASH', latency: '<30d', effort: 'Med', notes: 'Find safety bypasses in Gemini.' },

    // SECTION E: REFERENCE / OTHER
    { id: 901, sec: 'E', name: 'Huberman Family Fund', type: 'GRANT', status: 'BLOCKED', deadline: 'Unknown', 
      link_apply: 'mailto:grants@huberman.org', 
      reality: 'CASH', latency: 'Unk', effort: 'High', notes: 'Evaluation & Monitoring focus.' },
      
    { id: 902, sec: 'E', name: 'Mozilla Tech Fund', type: 'GRANT', status: 'BLOCKED', deadline: 'Closed', 
      link_apply: 'https://foundation.mozilla.org/en/what-we-fund/', 
      reality: 'CASH', latency: '6mo', effort: 'High', notes: 'Audit tools.' }
];

const app = {
    data: [],

    init() {
        this.loadData();
        this.renderTable();
    },

    loadData() {
        const stored = localStorage.getItem(DB_KEY);
        if (stored) {
            this.data = JSON.parse(stored);
            this.safeMigrate(); // Instruction C
        } else {
            this.data = seedData;
            this.saveData();
        }
    },

    // INSTRUCTION C: SAFE MIGRATE (Fix Undefined)
    safeMigrate() {
        let changed = false;
        this.data.forEach(item => {
            // If missing logistics, set defaults so no "undefined"
            if (!item.reality) { item.reality = 'UNKNOWN'; changed = true; }
            if (!item.latency) { item.latency = 'Unk'; changed = true; }
            if (!item.effort) { item.effort = 'Med'; changed = true; }
            // Ensure Sec A structure is correct (Instruction A)
            if (['NLnet Foundation (NGI Zero)', 'AI Safety Camp (AISC)', 'BlueDot Impact (AGI Strategy)'].some(n => item.name.includes(n))) {
                if(item.sec !== 'A') { item.sec = 'A'; changed = true; }
            }
        });
        if (changed) this.saveData();
    },

    saveData() {
        localStorage.setItem(DB_KEY, JSON.stringify(this.data));
    },

    resetData() {
        if(confirm('Reset all local data to v14 seed?')) {
            this.data = seedData;
            this.saveData();
            this.renderTable();
        }
    },

    // INSTRUCTION D: DUAL SEARCH LOGIC
    handleSearch() {
        const globalVal = document.getElementById('search-input').value.toLowerCase();
        const quickVal = document.getElementById('quick-search').value.toLowerCase(); // New input
        const statusVal = document.getElementById('filter-status').value;
        const typeVal = document.getElementById('filter-type').value;

        const filtered = this.data.filter(item => {
            // 1. Status Filter
            if (statusVal !== 'ALL' && item.status !== statusVal) return false;
            // 2. Type Filter
            if (typeVal !== 'ALL' && item.type !== typeVal) return false;
            
            // 3. Global Search (Generic)
            const globalMatch = !globalVal || Object.values(item).some(val => 
                String(val).toLowerCase().includes(globalVal)
            );

            // 4. Quick Search (Specific Fields + Apply Link)
            const quickMatch = !quickVal || (
                (item.name && item.name.toLowerCase().includes(quickVal)) ||
                (item.notes && item.notes.toLowerCase().includes(quickVal)) ||
                (item.link_apply && item.link_apply.toLowerCase().includes(quickVal)) ||
                (item.status && item.status.toLowerCase().includes(quickVal)) ||
                (item.type && item.type.toLowerCase().includes(quickVal))
            );

            return globalMatch && quickMatch;
        });

        this.renderTable(filtered);
    },

    renderTable(dataSet = this.data) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        // Sort: Section A first, then ID
        const sorted = [...dataSet].sort((a, b) => {
            if (a.sec === b.sec) return a.id - b.id;
            return a.sec.localeCompare(b.sec);
        });

        document.getElementById('record-count').innerText = `${sorted.length} Records`;

        sorted.forEach(item => {
            const tr = document.createElement('tr');
            
            // Logistics rendering (Instruction C: prevent undefined)
            const logisticsHtml = `
                <span class="logistics-tag">${item.reality || 'UNKNOWN'}</span>
                <span class="logistics-tag">${item.latency || 'Unk'}</span>
                <span class="logistics-tag">Effort: ${item.effort || 'Med'}</span>
            `;

            tr.innerHTML = `
                <td><span class="cell-sec sec-${item.sec}">${item.sec}</span></td>
                <td><span class="cell-id">#${item.id}</span></td>
                <td class="cell-name" title="${item.notes || ''}">${item.name}</td>
                <td><span class="logistics-tag">${item.type}</span></td>
                <td><span class="status-badge st-${item.status.toLowerCase().substring(0,4)}">${item.status}</span></td>
                <td>${logisticsHtml}</td>
                <td>${item.deadline}</td>
                <td>
                    ${item.link_apply ? `<a href="${item.link_apply}" target="_blank" rel="noopener noreferrer" class="btn-apply">APPLY ↗</a>` : '<span style="color:#cbd5e1">-</span>'}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
};

// Boot
app.init();
</script>
</body>
</html>
