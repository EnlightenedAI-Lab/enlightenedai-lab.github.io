<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EAIRL | FUNDING CMD v15.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            /* COLOR PALETTE - LAB STANDARD */
            --bg: #ffffff; 
            --surface: #f4f4f5; 
            --border: #e4e4e7;
            --text-main: #09090b; 
            --text-muted: #71717a;
            --accent: #18181b; 
            --highlight: #2563eb; 
            
            /* STATUS COLORS */
            --st-identify: #71717a;
            --st-drafting: #d97706;
            --st-submitted: #059669;
            --st-won: #16a34a;
            --st-rejected: #dc2626;
            
            /* TYPE BADGES */
            --badge-grant: #e0f2fe; --text-grant: #075985;
            --badge-bounty: #fee2e2; --text-bounty: #991b1b;
            --badge-regrant: #f3e8ff; --text-regrant: #6b21a8;
            --badge-contract: #fef3c7; --text-contract: #92400e;
            --badge-prize: #dcfce7; --text-prize: #166534;
            --badge-accel: #fae8ff; --text-accel: #86198f;
            --badge-uni: #dbeafe; --text-uni: #1e40af;
            --badge-partner: #ffedd5; --text-partner: #c2410c;

            /* LOGISTICS PILLS */
            --pill-bg: #f4f4f5; --pill-text: #52525b;
        }

        body[data-theme="dark"] {
            --bg: #09090b; --surface: #18181b; --border: #27272a;
            --text-main: #fafafa; --text-muted: #a1a1aa;
            --accent: #fafafa; --highlight: #3b82f6;
            --badge-grant: #0c4a6e; --text-grant: #bae6fd;
            --badge-bounty: #450a0a; --text-bounty: #fecaca;
            --badge-regrant: #3b0764; --text-regrant: #e9d5ff;
            --badge-contract: #451a03; --text-contract: #fde68a;
            --badge-prize: #052e16; --text-prize: #86efac;
            --badge-accel: #4a044e; --text-accel: #f0abfc;
            --badge-uni: #172554; --text-uni: #bfdbfe;
            --badge-partner: #431407; --text-partner: #fdba74;
            --pill-bg: #27272a; --pill-text: #d4d4d8;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Inter", sans-serif; background: var(--bg); color: var(--text-main); font-size: 13px; height: 100vh; overflow: hidden; display: flex; }

        /* --- LAYOUT --- */
        aside { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; z-index: 10; }
        main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; }
        
        /* --- TYPOGRAPHY --- */
        .mono { font-family: "JetBrains Mono", monospace; }
        h1 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 4px 0; }
        .subtitle { font-size: 11px; color: var(--text-muted); }
        
        /* --- COMPONENTS --- */
        .btn {
            background: var(--bg); border: 1px solid var(--border); color: var(--text-main);
            padding: 6px 12px; font-family: "JetBrains Mono", monospace; font-size: 11px;
            cursor: pointer; text-transform: uppercase; transition: all 0.1s;
        }
        .btn:hover { border-color: var(--highlight); color: var(--highlight); }
        
        .status-badge {
            font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 2px;
            font-family: "JetBrains Mono", monospace; border: 1px solid transparent; display:inline-block; margin-bottom:2px;
        }
        
        .pill {
            font-size: 9px; padding: 1px 4px; border-radius: 3px; font-family: "JetBrains Mono", monospace; 
            margin-right: 2px; display: inline-block; background: var(--pill-bg); color: var(--pill-text);
        }

        /* --- SEARCH & FILTERS --- */
        .search-container { margin-bottom: 20px; position: sticky; top: 0; background: var(--bg); z-index: 20; padding-top: 5px; }
        .filters-row { display: flex; gap: 8px; margin-bottom: 5px; }
        .search-input {
            flex: 1; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border);
            color: var(--text-main); font-family: "JetBrains Mono", monospace; font-size: 12px;
        }
        .search-input:focus { border-color: var(--highlight); outline: none; }
        
        /* --- DATA TABLES --- */
        .section-header {
            padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
            border-top: 1px solid var(--border); font-family: "JetBrains Mono", monospace; font-weight: 700;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .section-header:hover { background: var(--border); }
        
        table { width: 100%; border-collapse: collapse; }
        th { 
            text-align: left; padding: 8px 12px; font-family: "JetBrains Mono", monospace; 
            font-size: 10px; text-transform: uppercase; color: var(--text-muted); 
            border-bottom: 1px solid var(--border); background: var(--bg);
            position: sticky; top: 0; z-index: 5;
        }
        td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
        tr:hover td { background: var(--surface); }

        /* --- INPUTS --- */
        input, select {
            background: transparent; border: 1px solid transparent; color: var(--text-main);
            font-family: inherit; font-size: 12px; width: 100%; padding: 2px 4px;
        }
        input:focus, select:focus { border-color: var(--highlight); outline: none; background: var(--bg); }
        
        /* --- MODALS --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(2px); z-index: 100;
            align-items: center; justify-content: center;
        }
        .modal-box {
            background: var(--bg); border: 1px solid var(--border); width: 900px; max-width: 95%;
            height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal-header {
            padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; 
            justify-content: space-between; font-weight: 700; font-family: "JetBrains Mono", monospace;
        }
        .editor-area {
            flex: 1; padding: 20px; overflow-y: auto; outline: none; font-family: "Inter", sans-serif;
            line-height: 1.6;
        }
        .editor-area img { max-width: 100%; border: 1px solid var(--border); margin: 10px 0; }
        .toolbar { padding: 8px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; background: var(--surface); }

        /* --- UTILS --- */
        .icon-btn { cursor: pointer; opacity: 0.5; transition: opacity 0.2s; font-size: 14px; background: none; border: none; padding: 0 4px; }
        .icon-btn:hover { opacity: 1; color: var(--highlight); }
        
        .stat-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); margin-bottom: 20px; border: 1px solid var(--border); }
        .stat-item { background: var(--bg); padding: 10px; text-align: center; }
        .stat-val { display: block; font-weight: 700; font-size: 16px; }
        .stat-lbl { font-size: 9px; text-transform: uppercase; color: var(--text-muted); font-family: "JetBrains Mono", monospace; }
        
        .file-list { margin-top: 20px; border: 1px solid var(--border); }
        .file-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border); align-items: center; }
        .log-item { padding: 8px; border-bottom: 1px solid var(--border); font-size: 11px; }

        /* Version Tag */
        .ver-tag { position:fixed; bottom:20px; right:20px; font-family:'JetBrains Mono'; font-size:10px; color:red; border:1px solid red; padding:4px 8px; background:var(--bg); border-radius:4px; z-index:1000; }
        
        .priority-star { cursor: pointer; color: var(--border); transition: color 0.2s; font-size: 14px; margin-right: 5px; }
        .priority-star.active { color: #eab308; } /* Yellow */
    </style>
</head>

                'B': 'SECTION B: COMPETITIONS & BOUNTIES',
                'C': 'SECTION C: VERIFIED REGRANTORS',
                'D': 'SECTION D: SUBMITTED / ARCHIVE',
                'E': 'SECTION E: STRATEGIC MONITOR',
                'F': 'SECTION F: UNIVERSITY / RESEARCH LABS',
                'G': 'SECTION G: ACCELERATORS / PARTNERS'
            };

            for (const [key, title] of Object.entries(sections)) {
                let items = db.filter(i => i.sec === key);
                
                // FILTERING
                if (searchVal) {
                    items = items.filter(i => 
                        i.name.toLowerCase().includes(searchVal) || 
                        (i.notes && i.notes.toLowerCase().includes(searchVal)) || 
                        (i.mode && i.mode.toLowerCase().includes(searchVal)) ||
                        String(i.id).includes(searchVal)
                    );
                }

                if (items.length === 0) continue;

                const isOpen = openSections[key] || searchVal ? 'open' : '';
                
                let html = `
                    <details ${isOpen} style="margin-bottom:20px; border:1px solid var(--border);" ontoggle="toggleSection('${key}')">
                        <summary class="section-header">
                            <span>${title}</span>
                            <span class="mono" style="font-size:10px; opacity:0.5;">${items.length}</span>
                        </summary>
                        <table>
                            <thead>
                                <tr>
                                    <th style="width:5%">ID</th>
                                    <th style="width:20%">Target</th>
                                    <th style="width:10%">Type / Mode</th>
                                    <th style="width:10%">Logistics</th>
                                    <th style="width:8%">Deadline</th>
                                    <th style="width:12%">Status</th>
                                    <th style="width:15%">Next Action</th>
                                    <th style="width:7%">Last</th>
                                    <th style="width:10%">Notes</th>
                                    <th style="width:5%">Tools</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                items.forEach(i => {
                    const statusColor = `var(--st-${(i.status||'identify').toLowerCase()})`;
                    const typeClass = (i.type||'grant').toLowerCase().includes('grant') ? 'grant' : 
                                      (i.type||'').toLowerCase().includes('bounty') ? 'bounty' : 
                                      (i.type||'').toLowerCase().includes('regrant') ? 'regrant' : 
                                      (i.type||'').toLowerCase().includes('accel') ? 'accel' :
                                      (i.type||'').toLowerCase().includes('uni') ? 'uni' :
                                      (i.type||'').toLowerCase().includes('partner') ? 'partner' :
                                      (i.type||'').toLowerCase().includes('prize') ? 'prize' : 'contract';
                    
                    const badgeStyle = `background:var(--badge-${typeClass}); color:var(--text-${typeClass});`;
                    const hasFiles = (i.files && i.files.length > 0) ? 'color:var(--highlight); opacity:1;' : '';
                    const dateStr = (i.updated && typeof i.updated === 'string' && i.updated.length >= 5) ? i.updated.slice(5) : '-';
                    const starClass = i.priority ? 'active' : '';

                    html += `
                        <tr>
                            <td class="mono" style="font-size:10px; opacity:0.6;">${i.sec}-${i.id}</td>
                            <td>
                                <div>
                                    <span class="priority-star ${starClass}" onclick="togglePriority(${i.id})">★</span>
                                    <span style="font-weight:700;">${i.name}</span>
                                </div>
                                <div style="font-size:10px; margin-top:2px;">${i.link_apply ? `<a href="${i.link_apply}" target="_blank" style="color:var(--highlight); text-decoration:none;">APPLY ↗</a>` : ''}</div>
                            </td>
                            <td>
                                <span class="status-badge" style="${badgeStyle}">${i.type}</span>
                                <div style="font-size:9px; margin-top:2px; color:var(--text-muted);">${i.mode}</div>
                            </td>
                            <td>
                                <span class="pill">${i.magnitude}</span> <span class="pill">${i.speed}</span>
                            </td>
                            <td><input class="mono" value="${i.deadline||''}" onchange="update(${i.id}, 'deadline', this.value)"></td>
                            <td>
                                <select class="status-select" style="color:${statusColor}; font-weight:700;" onchange="update(${i.id}, 'status', this.value)">
                                    <option ${i.status==='Identify'?'selected':''}>Identify</option>
                                    <option ${i.status==='Drafting'?'selected':''}>Drafting</option>
                                    <option ${i.status==='Submitted'?'selected':''}>Submitted</option>
                                    <option ${i.status==='Follow-up'?'selected':''}>Follow-up</option>
                                    <option ${i.status==='Won'?'selected':''}>Won</option>
                                    <option ${i.status==='Rejected'?'selected':''}>Rejected</option>
                                    <option ${i.status==='Archived'?'selected':''}>Archived</option>
                                </select>
                            </td>
                            <td><input value="${i.next||''}" onchange="update(${i.id}, 'next', this.value)"></td>
                            <td class="mono" style="font-size:9px; color:var(--text-muted);">${dateStr}</td>
                            <td><input value="${i.notes||''}" onchange="update(${i.id}, 'notes', this.value)"></td>
                            <td>
                                <button class="icon-btn" style="${hasFiles}" onclick="openFileModal(${i.id})"><svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0V3z"/></svg></button>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table></details>`;
                container.innerHTML += html;
            }
        }

        function renderStats() {
            const total = db.length;
            const submitted = db.filter(i => i.status === 'Submitted').length;
            const goal = 5; 
            const pct = Math.min((submitted / goal) * 100, 100);

            document.getElementById('goal-bar').style.width = pct + "%";
            document.getElementById('goal-text').innerText = `${submitted} / ${goal}`;
            
            document.getElementById('stats-mount').innerHTML = `
                <div class="stat-item"><span class="stat-lbl">ACTIVE TARGETS</span><span class="stat-val">${total}</span></div>
                <div class="stat-item"><span class="stat-lbl" style="color:#d97706">DRAFTING</span><span class="stat-val" style="color:#d97706">${db.filter(i=>i.status==='Drafting').length}</span></div>
                <div class="stat-item"><span class="stat-lbl" style="color:#059669">SUBMITTED</span><span class="stat-val" style="color:#059669">${submitted}</span></div>
                <div class="stat-item"><span class="stat-lbl" style="color:#16a34a">WON</span><span class="stat-val" style="color:#16a34a">${db.filter(i=>i.status==='Won').length}</span></div>
            `;
        }

        function update(id, field, val) {
            const item = db.find(i => i.id === id);
            item[field] = val;
            item.updated = new Date().toISOString().split('T')[0];
            save(); renderApp();
        }

        function openFileModal(id) {
            activeId = id;
            document.getElementById('file-modal').style.display = 'flex';
            renderFiles(); renderLogs();
        }

        function openAddTargetModal() {
            document.getElementById('add-modal').style.display = 'flex';
        }

        function saveNewTarget() {
            const name = document.getElementById('new-name').value;
            if(!name) return alert("Name required");
            
            const newItem = {
                id: Date.now().toString().slice(-4), // Simple 4-digit ID
                sec: document.getElementById('new-sec').value,
                name: name,
                type: document.getElementById('new-type').value,
                mode: document.getElementById('new-mode').value,
                status: "Identify",
                deadline: "Rolling",
                magnitude: "Med",
                speed: "Med",
                priority: false,
                updated: new Date().toISOString().split('T')[0],
                files: [],
                logs: []
            };
            
            db.push(newItem);
            save();
            closeModal('add-modal');
            document.getElementById('new-name').value = '';
            renderApp();
        }

        function renderFiles() {
            const item = db.find(i => i.id === activeId);
            const list = document.getElementById('file-list');
            list.innerHTML = item.files.map((f, idx) => `
                <div class="file-item">
                    <div>
                        <span style="font-weight:700;">${f.name}</span>
                        ${f.link ? `<a href="${f.link}" target="_blank" style="margin-left:5px; color:var(--highlight);">OPEN ↗</a>` : ''}
                        ${f.content ? `<span style="font-size:9px; background:var(--border); padding:1px 4px; border-radius:2px; margin-left:5px;">DOC</span>` : ''}
                    </div>
                    <div>
                        <button class="btn" style="font-size:9px;" onclick="openEditor(${idx})">${f.content ? 'EDIT' : 'VIEW'}</button>
                        <button class="icon-btn" style="color:red;" onclick="delFile(${idx})">×</button>
                    </div>
                </div>
            `).join('') || '<div style="padding:10px; color:var(--text-muted); font-style:italic;">No attachments.</div>';
        }

        function addLink() {
            const name = document.getElementById('link-name').value;
            const url = document.getElementById('link-url').value;
            if (!name) return alert("Name required");
            const item = db.find(i => i.id === activeId);
            item.files.push({ name: name, link: url, content: null });
            item.updated = new Date().toISOString().split('T')[0];
            document.getElementById('link-name').value = ''; document.getElementById('link-url').value = '';
            save(); renderFiles(); renderApp();
        }

        function addDoc() {
            const item = db.find(i => i.id === activeId);
            item.files.push({ name: "Note / Draft", link: null, content: "" });
            item.updated = new Date().toISOString().split('T')[0];
            save(); openEditor(item.files.length - 1);
        }

        function delFile(idx) {
            const item = db.find(i => i.id === activeId);
            item.files.splice(idx, 1);
            item.updated = new Date().toISOString().split('T')[0];
            save(); renderFiles(); renderApp();
        }

        function openEditor(idx) {
            activeFileIndex = idx;
            const item = db.find(i => i.id === activeId);
            document.getElementById('rich-editor').innerHTML = item.files[idx].content || "";
            document.getElementById('file-modal').style.display = 'none';
            document.getElementById('editor-modal').style.display = 'flex';
        }

        function saveEditorContent() {
            const content = document.getElementById('rich-editor').innerHTML;
            const item = db.find(i => i.id === activeId);
            item.files[activeFileIndex].content = content;
            item.updated = new Date().toISOString().split('T')[0];
            save();
            document.getElementById('editor-modal').style.display = 'none';
            document.getElementById('file-modal').style.display = 'flex';
            renderFiles();
        }

        function format(cmd, val) { document.execCommand(cmd, false, val); }

        function addLog() {
            const txt = document.getElementById('log-input').value;
            if(!txt) return;
            const item = db.find(i => i.id === activeId);
            item.logs.unshift({ date: new Date().toISOString().split('T')[0], text: txt });
            item.updated = new Date().toISOString().split('T')[0];
            document.getElementById('log-input').value = '';
            save(); renderLogs(); renderApp();
        }

        function renderLogs() {
            const item = db.find(i => i.id === activeId);
            document.getElementById('log-list').innerHTML = item.logs.map(l => `
                <div class="log-item">
                    <span class="mono" style="color:var(--text-muted); margin-right:5px;">${l.date}</span>
                    ${l.text}
                </div>
            `).join('');
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function save() { 
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(db));
                updateMemory();
            } catch(e) { alert("STORAGE FULL."); }
        }

        function updateMemory() {
            const used = JSON.stringify(localStorage).length;
            const pct = Math.round((used / 5000000) * 100);
            document.getElementById('mem-val').innerText = pct + "%";
            document.getElementById('mem-fill').style.width = pct + "%";
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const a = document.createElement('a'); a.href = dataStr; a.download = "eairl_funding_db.json"; a.click(); a.remove();
        }

        function toggleTheme() {
            const b = document.body;
            b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        // Boot
        initApp();
    </script>
</body>
</html>
