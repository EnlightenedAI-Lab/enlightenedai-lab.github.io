<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funding Command | Rescue Mode v11</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #ffffff; --surface: #f4f4f5; --border: #e4e4e7;
            --text-main: #09090b; --text-muted: #71717a; --highlight: #2563eb;
            --badge-grant: #e0f2fe; --text-grant: #075985;
            --badge-bounty: #fee2e2; --text-bounty: #991b1b;
            --badge-regrant: #f3e8ff; --text-regrant: #6b21a8;
            --badge-contract: #fef3c7; --text-contract: #92400e;
            --badge-prize: #dcfce7; --text-prize: #166534;
            --st-drafting: #d97706; --st-submitted: #059669; --st-won: #16a34a;
        }
        body { margin: 0; font-family: "Inter", sans-serif; background: var(--bg); color: var(--text-main); font-size: 13px; display: flex; height: 100vh; }
        
        aside { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; }
        main { flex: 1; overflow-y: auto; padding: 30px; }

        .mono { font-family: "JetBrains Mono", monospace; }
        h1 { font-size: 16px; font-weight: 700; margin: 0 0 5px 0; text-transform: uppercase; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 10px; text-transform: uppercase; }
        td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
        
        .btn { background: #fff; border: 1px solid var(--border); padding: 5px 10px; cursor: pointer; font-size: 10px; text-transform: uppercase; }
        .btn:hover { border-color: var(--highlight); color: var(--highlight); }
        
        input, select { background: transparent; border: 1px solid transparent; width: 100%; font-family: inherit; font-size: 12px; }
        input:focus, select:focus { border-color: var(--highlight); outline: none; background: #fff; }

        .badge { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; }
        .grant { background: var(--badge-grant); color: var(--text-grant); }
        .bounty { background: var(--badge-bounty); color: var(--text-bounty); }
        .regrant { background: var(--badge-regrant); color: var(--text-regrant); }
        .prize { background: var(--badge-prize); color: var(--text-prize); }
        .contract { background: var(--badge-contract); color: var(--text-contract); }

        details { margin-bottom: 20px; border: 1px solid var(--border); }
        summary { padding: 10px; background: var(--surface); cursor: pointer; font-weight: 700; font-size: 11px; display: flex; justify-content: space-between; }
        
        /* ERROR BOX */
        #error-box { background: #fee2e2; color: #991b1b; padding: 10px; border: 1px solid #991b1b; margin-bottom: 20px; display: none; font-family: monospace; }

        /* MODALS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal-box { background: #fff; width: 800px; max-width: 90%; height: 80vh; border: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .editor-area { flex: 1; border: 1px solid var(--border); margin: 10px 0; padding: 10px; overflow-y: auto; outline: none; }
    </style>
</head>
<body>

    <aside>
        <div style="font-weight:700;">ENLIGHTENED AI</div>
        <div style="font-size:10px; color:#666; margin-bottom:30px;">RESCUE MODE v11</div>
        <button class="btn" style="color:red; border-color:red; margin-top:auto;" onclick="hardReset()">⚠ WIPE DATA (RESET)</button>
    </aside>

    <main>
        <div id="error-box"></div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h1>Funding Command</h1>
            <button class="btn" onclick="exportData()">DOWNLOAD BACKUP</button>
        </div>

        <div id="app-container"></div>
    </main>

    <div id="editor-modal" class="modal-overlay">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between; font-weight:700;">
                <span>DOCUMENT EDITOR</span>
                <span style="cursor:pointer;" onclick="closeModal()">✕</span>
            </div>
            <div class="editor-area" id="rich-editor" contenteditable="true"></div>
            <button class="btn" onclick="saveEditor()">SAVE & CLOSE</button>
        </div>
    </div>

    <script>
        // --- SAFE MODE CONFIG ---
        const DB_KEY = 'eairl_v11_safe'; // Fresh Key
        
        // --- SEED DATA ---
        const seedData = [
            { id: 1, sec: 'A', name: "NLnet Foundation", type: "Grant", status: "Identify", deadline: "Feb 1", notes: "Top Priority" },
            { id: 2, sec: 'A', name: "Emergent Ventures", type: "Grant", status: "Identify", deadline: "Rolling", notes: "High Upside" },
            { id: 3, sec: 'A', name: "NRC IRAP", type: "Grant", status: "Identify", deadline: "Rolling", notes: "AI Assist" },
            { id: 98, sec: 'C', name: "NextAI", type: "Accel", status: "Submitted", deadline: "Submitted", notes: "Applied Dec 29" },
            { id: 99, sec: 'C', name: "Foresight Institute", type: "Grant", status: "Submitted", deadline: "Submitted", notes: "Applied Dec 29" },
            { id: 6, sec: 'B', name: "Google VRP", type: "Bounty", status: "Identify", deadline: "Open", notes: "Vuln Reward" },
            { id: 7, sec: 'B', name: "Microsoft Bounty", type: "Bounty", status: "Identify", deadline: "Open", notes: "Zero Day" },
            { id: 20, sec: 'C', name: "Evan Hubinger", type: "Regrant", status: "Identify", deadline: "Rolling", notes: "Manifund" },
            { id: 21, sec: 'C', name: "Neel Nanda", type: "Regrant", status: "Identify", deadline: "Rolling", notes: "Mech Interp" }
        ];

        let db = [];
        let activeId = null;

        // --- ERROR CATCHER ---
        window.onerror = function(msg, url, line) {
            const box = document.getElementById('error-box');
            box.style.display = 'block';
            box.innerText = `System Error: ${msg} (Line ${line})`;
            return false;
        };

        // --- INIT ---
        try {
            const saved = localStorage.getItem(DB_KEY);
            if (saved) {
                db = JSON.parse(saved);
                // Fix missing fields
                db.forEach(i => { if(!i.files) i.files = []; });
            } else {
                db = seedData;
                db.forEach(i => i.files = []); // Ensure files array exists
                localStorage.setItem(DB_KEY, JSON.stringify(db));
            }
            render();
        } catch(e) {
            console.error(e);
            document.getElementById('error-box').style.display = 'block';
            document.getElementById('error-box').innerText = "Data Corrupt. Click 'Wipe Data' in sidebar.";
        }

        function render() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            const sections = {
                'A': 'ACTIVE OPS',
                'B': 'BOUNTIES',
                'C': 'SUBMITTED / REGRANTORS',
                'D': 'MONITOR'
            };

            for (const [key, title] of Object.entries(sections)) {
                const items = db.filter(i => i.sec === key);
                if (items.length === 0) continue;

                let html = `
                    <details open>
                        <summary>${title} (${items.length})</summary>
                        <table>
                            <thead><tr><th>Target</th><th>Type</th><th>Status</th><th>Notes</th><th>Tools</th></tr></thead>
                            <tbody>
                `;

                items.forEach(i => {
                    const typeClass = (i.type||'').toLowerCase().includes('grant') ? 'grant' : (i.type||'').toLowerCase().includes('bounty') ? 'bounty' : 'contract';
                    
                    html += `
                        <tr>
                            <td style="font-weight:700;">${i.name}</td>
                            <td><span class="badge ${typeClass}">${i.type}</span></td>
                            <td>
                                <select onchange="update(${i.id}, 'status', this.value)">
                                    <option ${i.status==='Identify'?'selected':''}>Identify</option>
                                    <option ${i.status==='Drafting'?'selected':''}>Drafting</option>
                                    <option ${i.status==='Submitted'?'selected':''}>Submitted</option>
                                    <option ${i.status==='Won'?'selected':''}>Won</option>
                                </select>
                            </td>
                            <td><input value="${i.notes||''}" onchange="update(${i.id}, 'notes', this.value)"></td>
                            <td><button class="btn" onclick="openEditor(${i.id})">📝 DOCS</button></td>
                        </tr>
                    `;
                });

                html += `</tbody></table></details>`;
                container.innerHTML += html;
            }
        }

        function update(id, field, val) {
            const item = db.find(i => i.id === id);
            item[field] = val;
            save();
        }

        function openEditor(id) {
            activeId = id;
            const item = db.find(i => i.id === id);
            // Ensure file slot exists
            if (item.files.length === 0) item.files.push({ content: "" });
            
            document.getElementById('rich-editor').innerHTML = item.files[0].content || "";
            document.getElementById('editor-modal').style.display = 'flex';
        }

        function saveEditor() {
            const txt = document.getElementById('rich-editor').innerHTML;
            const item = db.find(i => i.id === activeId);
            item.files[0].content = txt;
            save();
            document.getElementById('editor-modal').style.display = 'none';
        }

        function closeModal() { document.getElementById('editor-modal').style.display = 'none'; }

        function save() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function hardReset() {
            if(confirm("Reset all data to defaults?")) {
                localStorage.removeItem(DB_KEY);
                location.reload();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const a = document.createElement('a'); a.href = dataStr; a.download = "rescue_backup.json"; a.click(); a.remove();
        }
    </script>
</body>
</html>
