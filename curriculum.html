<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Curriculum | Enlightened AI Research Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --sidebar-bg: #000;
      --text: #f0f0f0;
      --text-muted: #666;
      --accent: #00ff00;
      --border: #1a1a1a;
      --sidebar-w: 400px;
      --header-h: 120px;
    }

    [data-theme="light"] {
      --bg: #f9f9f9;
      --sidebar-bg: #ffffff;
      --text: #121212;
      --text-muted: #888;
      --accent: #00aa00;
      --border: #e0e0e0;
    }

    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }
    
    /* SIDEBAR NAVIGATION */
    aside { width: var(--sidebar-w); border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--sidebar-bg); flex-shrink: 0; }
    
    .nav-top { padding: 1.5rem; border-bottom: 1px solid var(--border); }
    .home-link { text-decoration: none; color: var(--text-muted); font-family: 'JetBrains Mono'; font-size: 0.65rem; display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; transition: 0.2s; }
    .home-link:hover { color: var(--accent); }

    .sidebar-header h1 { font-size: 0.9rem; font-family: 'JetBrains Mono'; color: var(--text); margin: 0; text-transform: uppercase; letter-spacing: 0.1em; }
    .duration-meta { font-size: 0.65rem; color: var(--accent); margin-top: 6px; font-family: 'JetBrains Mono'; opacity: 0.8; }
    
    .profile-toggle { margin-top: 12px; display: flex; gap: 8px; }
    .profile-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-family: 'JetBrains Mono'; font-size: 0.55rem; padding: 3px 6px; cursor: pointer; transition: 0.2s; }
    .profile-btn:hover { border-color: var(--accent); color: var(--accent); }

    .video-list { flex: 1; overflow-y: auto; padding: 0; scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
    
    /* REFINED HEADINGS */
    .level-heading { 
      padding: 20px 20px 8px 20px; 
      font-size: 0.65rem; 
      font-weight: 800; 
      color: var(--text-muted); 
      background: var(--sidebar-bg);
      position: sticky; top: 0; z-index: 10;
      text-transform: uppercase; letter-spacing: 0.15em; font-family: 'JetBrains Mono';
      border-bottom: 1px solid var(--border);
    }
    .level-heading span { color: var(--accent); margin-right: 10px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .video-item { padding: 12px 20px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 12px; transition: 0.2s; }
    .video-item:hover { background: rgba(0,255,0,0.02); }
    .video-item.active { background: rgba(0,255,0,0.05); border-left: 2px solid var(--accent); }
    
    .v-num { font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--text-muted); min-width: 30px; padding-top: 3px; }
    .video-item.active .v-num { color: var(--accent); }
    .v-title { font-size: 0.8rem; font-weight: 500; color: var(--text); line-height: 1.4; opacity: 0.8; }
    .video-item.active .v-title { opacity: 1; font-weight: 700; }

    /* MAIN THEATRE */
    main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
    .player-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem; }
    .video-wrapper { width: 100%; max-width: 1000px; aspect-ratio: 16/9; background: #000; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    iframe { width: 100%; height: 100%; border: none; }

    .lecture-bar { padding: 1.5rem 3rem; border-top: 1px solid var(--border); background: var(--sidebar-bg); display: flex; justify-content: space-between; align-items: center; }
    .v-id-tag { font-family: 'JetBrains Mono'; font-size: 0.6rem; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
    .lecture-bar h2 { margin: 0; font-size: 1.1rem; letter-spacing: -0.01em; }
    
    .status-badge { font-family: 'JetBrains Mono'; font-size: 0.55rem; color: var(--accent); border: 1px solid var(--accent); padding: 4px 8px; border-radius: 2px; opacity: 0.6; }
  </style>
</head>
<body data-theme="dark">

  <aside>
    <div class="nav-top">
      <a href="index.html" class="home-link">← RETURN_TO_TERMINAL</a>
      <div class="sidebar-header">
        <h1>Inside Alignment</h1>
        <div class="duration-meta">RUNTIME: 24:15 // 57 MODULES</div>
      </div>
      <div class="profile-toggle">
        <button class="profile-btn" onclick="setTheme('dark')">CORE_DARK</button>
        <button class="profile-btn" onclick="setTheme('light')">LAB_LIGHT</button>
      </div>
    </div>
    <div class="video-list" id="syllabus"></div>
  </aside>

  <main>
    <div class="player-container">
      <div class="video-wrapper" id="player"></div>
    </div>
    <div class="lecture-bar">
      <div>
        <div id="active-tag" class="v-id-tag">DOC_ID: EAI-00.1</div>
        <h2 id="active-title">Awaiting Initialization...</h2>
      </div>
      <div class="status-badge">INTEGRITY: VERIFIED</div>
    </div>
  </main>

  <script>
    const playlistID = "PL0TbB-9Inn_UAIRt19B9DYhAOlnMb_Cmh";
    const levelNames = ["Foundations", "What Is Alignment?", "Internal Dynamics", "Framework Needs", "The 5R Framework", "RDL Logic", "RDL Prediction", "Measurability", "Implications Today", "The Vision"];

    const namedModules = {
      1: { lvl: 0, num: "0.1", title: "What Intelligence Really Is" },
      2: { lvl: 0, num: "0.2", title: "Why Minds Drift" },
      3: { lvl: 0, num: "0.3", title: "Where Stability Comes From" },
      4: { lvl: 0, num: "0.4", title: "Intelligence vs Behavior" },
      5: { lvl: 0, num: "0.5", title: "Why This Matters for AI" },
      6: { lvl: 1, num: "1.1", title: "Alignment Is Not Obedience" },
      7: { lvl: 1, num: "1.2", title: "The Boundary Problem" },
      8: { lvl: 1, num: "1.3", title: "Safe Answers vs Stable Thinking" },
      9: { lvl: 1, num: "1.4", title: "Filters vs Rules" },
      10: { lvl: 1, num: "1.5", title: "Instability Examples" },
      52: { lvl: 8, num: "8.2", title: "RAA + RDL Synergy" },
      53: { lvl: 8, num: "8.3", title: "The Mindset Shift" },
      54: { lvl: 8, num: "8.4", title: "Internal Dynamics Blind Spots" },
      55: { lvl: 8, num: "8.5", title: "Alignment as a Science" },
      56: { lvl: 9, num: "9.1", title: "Aligned Intelligence Vision" },
      57: { lvl: 9, num: "9.2", title: "The Built Future" }
    };

    function setTheme(t) { document.body.setAttribute('data-theme', t); }

    function loadVideo(index) {
        const moduleNum = index + 1;
        const v = namedModules[moduleNum] || { title: "Research Module " + moduleNum, num: moduleNum, lvl: Math.floor(index/6) };
        document.getElementById('player').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed?listType=playlist&list=${playlistID}&index=${moduleNum}&autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        document.getElementById('active-tag').innerText = "DOC_ID: EAI-" + v.num;
        document.getElementById('active-title').innerText = v.title;
        document.querySelectorAll('.video-item').forEach((el, i) => { el.classList.toggle('active', i === index); });
    }

    let currentLvl = -1;
    for(let i = 0; i < 57; i++) {
        const moduleNum = i + 1;
        const v = namedModules[moduleNum] || { lvl: Math.floor(i/6), num: moduleNum, title: "Module " + moduleNum };
        if (v.lvl !== currentLvl) {
            const h = document.createElement('div');
            h.className = 'level-heading';
            h.innerHTML = `<span>●</span> LEVEL ${v.lvl}: ${levelNames[v.lvl]}`;
            document.getElementById('syllabus').appendChild(h);
            currentLvl = v.lvl;
        }
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `<div class="v-num">${v.num}</div><div class="v-title">${v.title}</div>`;
        item.onclick = () => loadVideo(i);
        document.getElementById('syllabus').appendChild(item);
    }
    loadVideo(0);
  </script>
</body>
</html>
