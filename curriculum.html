<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Curriculum | Enlightened AI Research Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* --- READER PROFILES --- */
    :root {
      --bg: #0a0a0a;
      --sidebar-bg: #000;
      --text: #f0f0f0;
      --text-muted: #888;
      --accent: #00ff00;
      --border: #222;
      --sidebar-w: 420px;
      --item-hover: #0d0d0d;
    }

    [data-theme="light"] {
      --bg: #f5f5f5;
      --sidebar-bg: #ffffff;
      --text: #111111;
      --text-muted: #555;
      --accent: #008800;
      --border: #ddd;
      --item-hover: #f0f0f0;
    }

    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }
    
    /* SYLLABUS SIDEBAR */
    aside { width: var(--sidebar-w); border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--sidebar-bg); flex-shrink: 0; transition: background 0.3s; }
    .sidebar-header { padding: 1.5rem; border-bottom: 2px solid var(--accent); }
    .sidebar-header h1 { font-size: 0.9rem; font-family: 'JetBrains Mono'; color: var(--accent); margin: 0; text-transform: uppercase; letter-spacing: 0.15em; }
    
    .profile-toggle { margin-top: 15px; display: flex; gap: 10px; }
    .profile-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-family: 'JetBrains Mono'; font-size: 0.6rem; padding: 4px 8px; cursor: pointer; border-radius: 3px; }
    .profile-btn:hover { border-color: var(--accent); color: var(--accent); }

    .video-list { flex: 1; overflow-y: auto; padding: 0; scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
    
    /* HIGH VISIBILITY LEVEL HEADERS */
    .level-heading { 
      padding: 25px 20px 10px 20px; 
      font-size: 0.75rem; 
      font-weight: 800; 
      color: var(--accent); 
      background: var(--sidebar-bg);
      position: sticky;
      top: 0;
      z-index: 10;
      text-transform: uppercase; 
      letter-spacing: 0.2em; 
      font-family: 'JetBrains Mono'; 
      border-bottom: 1px solid var(--border);
    }

    .video-item { padding: 14px 20px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 15px; align-items: flex-start; transition: 0.2s; }
    .video-item:hover { background: var(--item-hover); }
    .video-item.active { background: var(--item-hover); border-left: 4px solid var(--accent); }
    
    .v-num { font-family: 'JetBrains Mono'; font-size: 0.7rem; color: var(--accent); font-weight: 700; min-width: 40px; }
    .v-title { font-size: 0.85rem; font-weight: 500; color: var(--text); line-height: 1.4; }

    /* THEATRE AREA */
    main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
    .player-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
    .video-wrapper { width: 100%; max-width: 1100px; aspect-ratio: 16/9; background: #000; border: 1px solid var(--border); box-shadow: 0 10px 50px rgba(0,0,0,0.5); }
    iframe { width: 100%; height: 100%; border: none; }

    .lecture-bar { padding: 1.5rem 3rem; background: var(--sidebar-bg); border-top: 1px solid var(--border); }
    .v-id-tag { font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--accent); margin-bottom: 5px; }
    .lecture-bar h2 { margin: 0; font-size: 1.2rem; font-weight: 800; }
  </style>
</head>

    const levelNames = ["Foundations", "What Is Alignment?", "Internal Dynamics", "Framework Needs", "The 5R Framework", "RDL Logic", "RDL Prediction", "Measurability", "Implications Today", "The Vision"];

    function setTheme(theme) { document.body.setAttribute('data-theme', theme); }

    function loadVideo(index) {
        const moduleNum = index + 1;
        const v = namedModules[moduleNum];
        document.getElementById('player').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed?listType=playlist&list=${playlistID}&index=${moduleNum}&autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        document.getElementById('active-tag').innerText = "MODULE " + v.num;
        document.getElementById('active-title').innerText = v.title;
        document.querySelectorAll('.video-item').forEach((el, i) => { el.classList.toggle('active', i === index); });
    }

    let currentLvl = -1;
    for(let i = 0; i < 57; i++) {
        const moduleNum = i + 1;
        const v = namedModules[moduleNum];
        if (v.lvl !== currentLvl) {
            const h = document.createElement('div');
            h.className = 'level-heading';
            h.innerText = `LEVEL ${v.lvl}: ${levelNames[v.lvl]}`;
            document.getElementById('syllabus').appendChild(h);
            currentLvl = v.lvl;
        }
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `<div class="v-num">${v.num}</div><div class="v-title">${v.title}</div>`;
        item.onclick = () => loadVideo(i);
        document.getElementById('syllabus').appendChild(item);
    }
    loadVideo(0);
