<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Curriculum | Enlightened AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f0f0f0;
      --accent: #00ff00;
      --sidebar-w: 320px;
      --border: #333;
    }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    
    /* LEFT SIDEBAR: SYLLABUS */
    aside { width: var(--sidebar-w); border-right: 1px solid var(--border); display: flex; flex-direction: column; background: #000; }
    .sidebar-header { padding: 2rem 1.5rem; border-bottom: 1px solid var(--border); }
    .sidebar-header h1 { font-size: 0.9rem; font-family: 'JetBrains Mono'; color: var(--accent); margin: 0; text-transform: uppercase; }
    
    .video-list { flex: 1; overflow-y: auto; padding: 10px 0; }
    .video-item { padding: 12px 20px; border-bottom: 1px solid #111; cursor: pointer; transition: 0.2s; display: flex; gap: 12px; align-items: center; }
    .video-item:hover { background: #111; }
    .video-item.active { background: #1a1a1a; border-left: 4px solid var(--accent); }
    .v-num { font-family: 'JetBrains Mono'; font-size: 0.7rem; color: var(--accent); min-width: 30px; }
    .v-title { font-size: 0.8rem; font-weight: 500; }

    /* MAIN AREA: THEATRE */
    main { flex: 1; display: flex; flex-direction: column; background: #050505; }
    .player-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; position: relative; }
    .video-wrapper { width: 100%; max-width: 1000px; aspect-ratio: 16/9; background: #000; border: 1px solid var(--border); box-shadow: 0 0 100px rgba(0,255,0,0.05); }
    iframe { width: 100%; height: 100%; border: none; }

    /* CONTROLS */
    .lecture-info { padding: 2rem 3rem; border-top: 1px solid var(--border); }
    .lecture-info h2 { margin: 0 0 10px 0; font-size: 1.2rem; }
    .lecture-info p { margin: 0; font-size: 0.9rem; color: #888; max-width: 800px; line-height: 1.6; }

    @media (max-width: 900px) {
      body { flex-direction: column; overflow: auto; }
      aside { width: 100%; height: 300px; order: 2; }
      main { height: auto; order: 1; }
    }
  </style>
</head>
<body>

  <aside>
    <div class="sidebar-header">
      <h1>Inside Alignment</h1>
      <div style="font-size: 0.7rem; color: #666; margin-top: 5px;">57 MODULE CURRICULUM</div>
    </div>
    <div class="video-list" id="syllabus">
      </div>
  </aside>

  <main>
    <div class="player-container">
      <div class="video-wrapper" id="player">
        <div style="display:flex; align-items:center; justify-content:center; height:100%; font-family:'JetBrains Mono'; color:#444;">
          SELECT MODULE TO BEGIN
        </div>
      </div>
    </div>

    <div class="lecture-info">
      <div id="active-meta" style="font-family:'JetBrains Mono'; font-size:0.7rem; color:var(--accent); margin-bottom:8px;">MODULE 0.0</div>
      <h2 id="active-title">Curriculum Foundations</h2>
      <p id="active-desc">Select a module from the syllabus to begin the sequence.</p>
    </div>
  </main>

  <script>
    // THE MANIFEST: Add all 57 IDs here.
    const videos = [
      { id: "v1qIu6qXN0w", title: "What Intelligence Really Is", desc: "Intelligence is the ability to navigate uncertainty through reasoning, reflection, and adaptation." },
      { id: "v1qIu6qXN0w", title: "Why Minds Drift", desc: "Without rigid constraints, all optimization processes tend toward simpler, unintended goals." },
      { id: "v1qIu6qXN0w", title: "Where Stability Comes From", desc: "Stability emerges from clear goals, steady reflection, and persistent system feedback." },
      { id: "v1qIu6qXN0w", title: "Intelligence vs Behavior", desc: "Behavior is what a system does; intelligence is the process of deciding what to do." },
      { id: "v1qIu6qXN0w", title: "Why This Matters for AI", desc: "Judging systems by output alone misses the internal dynamics that predict future failure." },
      { id: "v1qIu6qXN0w", title: "Alignment Is Not Obedience", desc: "True alignment is about shared intent, not just blind adherence to instructions." },
      // PASTE ADDITIONAL MODULES BELOW USING THE SAME FORMAT
    ];

    const syllabus = document.getElementById('syllabus');
    const player = document.getElementById('player');
    const metaText = document.getElementById('active-meta');
    const titleText = document.getElementById('active-title');
    const descText = document.getElementById('active-desc');

    function loadVideo(index) {
        const v = videos[index];
        // Update Player (No-Cookie for privacy)
        player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        
        // Update Info
        metaText.innerText = `MODULE ${index + 1}.0`;
        titleText.innerText = v.title;
        descText.innerText = v.desc;

        // Update Sidebar Active State
        document.querySelectorAll('.video-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });
    }

    // Initialize Sidebar
    videos.forEach((v, i) => {
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `<div class="v-num">${i + 1}</div><div class="v-title">${v.title}</div>`;
        item.onclick = () => loadVideo(i);
        syllabus.appendChild(item);
    });
  </script>
</body>
</html>
