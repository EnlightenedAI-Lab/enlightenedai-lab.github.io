  <style>
    :root {
      --bg: #0a0a0a;
      --sidebar-bg: #000;
      --text: #f0f0f0;
      --text-muted: #555;
      --accent: #00ff00;
      --border: #1a1a1a;
      --sidebar-w: 420px;
    }

    [data-theme="light"] {
      --bg: #fdfdfd;
      --sidebar-bg: #ffffff;
      --text: #121212;
      --text-muted: #999;
      --accent: #00aa00;
      --border: #ececec;
    }

    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }
    
    /* DISCRETE PULSE LINE - REPLACES THICK GREEN BAR */
    .status-pulse-container { width: 100%; height: 2px; background: transparent; position: relative; overflow: hidden; }
    .status-pulse { position: absolute; width: 60px; height: 100%; background: var(--accent); animation: slide 4s ease-in-out infinite; opacity: 0.4; }
    @keyframes slide { 0% { left: -10%; } 50% { left: 100%; } 100% { left: -10%; } }

    aside { width: var(--sidebar-w); border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--sidebar-bg); flex-shrink: 0; }
    
    .nav-top { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); }
    .terminal-link { text-decoration: none; color: var(--text-muted); font-family: 'JetBrains Mono'; font-size: 0.6rem; display: block; margin-bottom: 0.8rem; transition: 0.2s; letter-spacing: 0.1em; }
    .terminal-link:hover { color: var(--accent); }

    .sidebar-header h1 { font-size: 0.9rem; font-family: 'JetBrains Mono'; color: var(--text); margin: 0; text-transform: uppercase; letter-spacing: 0.1em; }
    .duration-meta { font-size: 0.65rem; color: var(--accent); margin-top: 5px; font-family: 'JetBrains Mono'; font-weight: 700; }
    
    .profile-switcher { margin-top: 12px; display: flex; gap: 8px; }
    .p-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-family: 'JetBrains Mono'; font-size: 0.55rem; padding: 4px 8px; cursor: pointer; border-radius: 2px; }
    .p-btn:hover { border-color: var(--accent); color: var(--accent); }

    .video-list { flex: 1; overflow-y: auto; padding: 0; scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
    
    /* REFINED VISIBILITY HEADERS */
    .level-heading { 
      padding: 22px 20px 8px 20px; 
      font-size: 0.65rem; 
      font-weight: 800; 
      color: var(--text-muted); 
      background: var(--sidebar-bg);
      position: sticky; top: 0; z-index: 10;
      text-transform: uppercase; letter-spacing: 0.15em; font-family: 'JetBrains Mono';
      border-bottom: 1px solid var(--border);
    }
    .level-heading span { color: var(--accent); font-weight: 400; margin-right: 8px; }

    .video-item { padding: 12px 20px; border-bottom: 1px solid #111; cursor: pointer; display: flex; gap: 15px; transition: 0.15s; border-left: 3px solid transparent; }
    .video-item:hover { background: rgba(0,255,0,0.02); }
    .video-item.active { background: rgba(0,255,0,0.04); border-left: 3px solid var(--accent); }
    
    .v-num { font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--text-muted); min-width: 32px; padding-top: 2px; }
    .video-item.active .v-num { color: var(--accent); }
    .v-title { font-size: 0.8rem; font-weight: 500; color: var(--text); line-height: 1.4; opacity: 0.7; }
    .video-item.active .v-title { opacity: 1; font-weight: 700; }

    main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
    .player-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .video-wrapper { width: 100%; max-width: 1000px; aspect-ratio: 16/9; background: #000; border: 1px solid var(--border); box-shadow: 0 40px 100px rgba(0,0,0,0.9); }
    iframe { width: 100%; height: 100%; border: none; }

    .info-footer { padding: 1.5rem 3rem; border-top: 1px solid var(--border); background: var(--sidebar-bg); display: flex; justify-content: space-between; align-items: center; }
    .v-meta-tag { font-family: 'JetBrains Mono'; font-size: 0.6rem; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
    .info-footer h2 { margin: 0; font-size: 1.1rem; font-weight: 800; }
  </style>
</head>
