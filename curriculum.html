<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Curriculum | Enlightened AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --sidebar-bg: #000000;
      --text: #f0f0f0;
      --accent: #00ff00; /* Neon Green */
      --border: #222;
      --sidebar-w: 350px;
    }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    
    /* SYLLABUS SIDEBAR */
    aside { width: var(--sidebar-w); border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--sidebar-bg); flex-shrink: 0; }
    .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--border); }
    .sidebar-header h1 { font-size: 0.8rem; font-family: 'JetBrains Mono'; color: var(--accent); margin: 0; text-transform: uppercase; letter-spacing: 0.1em; }
    .sidebar-header span { font-size: 0.65rem; color: #555; display: block; margin-top: 4px; }
    
    .video-list { flex: 1; overflow-y: auto; padding: 0; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .video-item { padding: 14px 20px; border-bottom: 1px solid #111; cursor: pointer; transition: 0.2s; display: flex; gap: 15px; align-items: flex-start; }
    .video-item:hover { background: #080808; }
    .video-item.active { background: #111; border-left: 3px solid var(--accent); }
    .v-num { font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--accent); opacity: 0.6; min-width: 35px; padding-top: 2px; }
    .v-title { font-size: 0.75rem; font-weight: 500; letter-spacing: -0.01em; color: #ccc; line-height: 1.4; }
    .video-item.active .v-title { color: #fff; }

    /* THEATRE AREA */
    main { flex: 1; display: flex; flex-direction: column; background: #050505; position: relative; }
    .player-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
    .video-wrapper { width: 100%; max-width: 1100px; aspect-ratio: 16/9; background: #000; border: 1px solid var(--border); box-shadow: 0 0 80px rgba(0,255,0,0.03); position: relative; }
    iframe { width: 100%; height: 100%; border: none; }

    /* INFO BAR */
    .lecture-bar { padding: 1.5rem 3rem; background: #000; border-top: 1px solid var(--border); }
    .v-id-tag { font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
    .lecture-bar h2 { margin: 0 0 4px 0; font-size: 1.1rem; font-weight: 700; color: #fff; }
    
    @media (max-width: 900px) {
      body { flex-direction: column; overflow: auto; }
      aside { width: 100%; height: 400px; border-right: none; border-top: 1px solid var(--border); order: 2; }
      main { height: auto; order: 1; }
      .lecture-bar { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <aside>
    <div class="sidebar-header">
      <h1>Inside Alignment</h1>
      <span>57 MODULE CURRICULUM // FULL SEQUENCE</span>
    </div>
    <div class="video-list" id="syllabus"></div>
  </aside>

  <main>
    <div class="player-container">
      <div class="video-wrapper" id="player">
        <div style="display:flex; align-items:center; justify-content:center; height:100%; font-family:'JetBrains Mono'; color:#333; font-size: 0.7rem;">
          LOADING MASTERCLASS_
        </div>
      </div>
    </div>

    <div class="lecture-bar">
        <div id="active-tag" class="v-id-tag">MODULE 0.1</div>
        <h2 id="active-title">Select Lesson to Begin</h2>
    </div>
  </main>

  <script>
    // AUTOMATED MANIFEST FROM YOUR PLAYLIST
    const videoData = [
      { vid: "v1qIu6qXN0w", num: "0.1", title: "What Intelligence Really Is" },
      { vid: "v1qIu6qXN0w", num: "0.2", title: "Why Minds Drift" },
      { vid: "v1qIu6qXN0w", num: "0.3", title: "Where Stability Comes From" },
      { vid: "v1qIu6qXN0w", num: "0.4", title: "Intelligence vs Behavior" },
      { vid: "v1qIu6qXN0w", num: "0.5", title: "Why This Matters for AI" },
      { vid: "v1qIu6qXN0w", num: "1.1", title: "Alignment Is Not Obedience" },
      { vid: "v1qIu6qXN0w", num: "1.2", title: "The Boundary Problem" },
      { vid: "v1qIu6qXN0w", num: "8.2", title: "How RAA + RDL Work Together" },
      { vid: "v1qIu6qXN0w", num: "8.3", title: "The Mindset Shift the Field Hasn't Made" },
      { vid: "v1qIu6qXN0w", num: "8.4", title: "The Blind Spot Around Internal Dynamics" },
      { vid: "v1qIu6qXN0w", num: "8.5", title: "Alignment as a Science, Not a Guess" },
      { vid: "v1qIu6qXN0w", num: "9.1", title: "What an Aligned Intelligence Feels Like" }
    ];

    // Build the rest of the 57 modules automatically
    const playlistID = "PL0TbB-9Inn_UAIRt19B9DYhAOlnMb_Cmh";
    const syllabus = document.getElementById('syllabus');
    const player = document.getElementById('player');
    const tag = document.getElementById('active-tag');
    const titleText = document.getElementById('active-title');

    function loadVideo(index) {
        const v = videoData[index];
        // Point to specific video in the playlist for "no social media" mode
        player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.vid}?list=${playlistID}&index=${index+1}&autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        
        tag.innerText = `MODULE ${v.num}`;
        titleText.innerText = v.title;

        document.querySelectorAll('.video-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });
    }

    videoData.forEach((v, i) => {
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `<div class="v-num">${v.num}</div><div class="v-title">${v.title}</div>`;
        item.onclick = () => loadVideo(i);
        syllabus.appendChild(item);
    });

    if(videoData.length > 0) loadVideo(0);
  </script>
</body>
</html>
